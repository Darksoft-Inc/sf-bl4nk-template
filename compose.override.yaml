
services:
###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###

###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432"
###< doctrine/doctrine-bundle ###

# Database inspection UI for development. The CLI has no open:local:db
# command, so the host port is fixed for a predictable URL.
  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: database
    ports:
      - "127.0.0.1:8080:8080"
